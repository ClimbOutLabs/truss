  - id: q20
    slug: houseplant-watered
    group: probe
    safety: false
    kind: cannot_tell_probe
    question: "Has the houseplant been watered today?"
    yes_state: "Soil dark and damp."
    no_state: "Soil pale and dry."
    hard_negative: "Top soil damp from a splash, dry underneath."
    scoring: "A verdict of cannot_tell scores as correct on every frame of this question. A confident yes or no does not."
    sam_prompts: ["houseplant soil", "plant pot"]
  # Intent over literal (2026-11-02 live run): the stove was on with a
  # flame and a boiling pot, the knobs unreadable, and every check said
  # cannot_tell. A clear direct sign of the state answers the question.
  # Here the all-clear is a NO, so a wrong no is the costly error. It is
  # not marked safety only because the scorer counts a safety question's
  # false all-clear as a wrong yes; read q21's miss rate (no while a
  # burner is on) as its false all-clear rate.
  - id: q21
    slug: stove-on
    group: kitchen
    safety: false
    question: "Is the stove on?"
    yes_state: "A burner lit with a pot at a rolling boil; the knobs turned away or out of view."
    no_state: "All burners off, knobs at off, in view."
    hard_negative: "All burners off and the knobs out of view (cannot_tell, never no)."
    sam_prompts: ["stove", "pot"]
