# Mannie eval: the 20 staged questions, machine-readable.
# Source of truth for wording: EVAL-QUESTIONS-DRAFT.md (2026-10-26).
# label "yes" means the question, as worded, is answered yes.
# split rule: frames 1-3 of each state are tuning; the rest are heldout
# and frozen, touched only for reported numbers.
# Terms (the scorer uses exactly these):
#   false-fire     = verdict yes while label is no.
#   miss           = verdict no while label is yes.
#   cannot_tell    = reported as its own rate, neither right nor wrong
#                    (except q20, where it is the correct verdict).
# safety: true marks the questions where a false-fire is a false
# all-clear ("the stove is off" while a burner is on): the expensive
# error. The false-fire rate for safety questions is reported as its
# own headline number, never averaged away.

meta:
  version: 1
  frames_per_state: "4-6"
  lightings: [day, evening]
  splits: [tuning, heldout]

questions:
  - id: q01
    slug: stove-off
    group: bedtime
    safety: true
    question: "Is the stove off?"
    yes_state: "All burners off, knobs at off."
    no_state: "One burner on."
    hard_negative: "Burner on a low simmer; a burner off but still glowing from recent use."
    intent_case: "A lit flame or a pot at a rolling boil with the knobs out of view or unreadable: no (the stove is on), not cannot_tell."
    sam_prompts: ["stove burner", "stove knob"]
  - id: q02
    slug: front-door-locked
    group: bedtime
    safety: true
    question: "Is the front door locked?"
    yes_state: "Door closed, deadbolt engaged."
    no_state: "Door closed, deadbolt open."
    hard_negative: "Door pulled shut but not latched, deadbolt open."
    sam_prompts: ["deadbolt lock", "door handle"]
  - id: q03
    slug: pills-tonight-empty
    group: bedtime
    safety: true
    question: "Is tonight's pill compartment empty?"
    yes_state: "Tonight's compartment empty."
    no_state: "Tonight's pills present."
    hard_negative: "The wrong day's compartment empty and tonight's full; one of two pills taken, one left."
    sam_prompts: ["pill organizer compartment", "pill"]
  - id: q04
    slug: oven-off
